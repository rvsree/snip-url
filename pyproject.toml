[project]
name = "snip-url"
version = "0.1.0"
description = "URL shortener built through a controlled agentic workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snip_url"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
